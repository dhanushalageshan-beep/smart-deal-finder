<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Deal Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 25px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 15px;
            background: #eef3ff;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🛒 Smart Deal Finder</h2>

    <input type="text" id="product" placeholder="Enter product name">
    <input type="number" id="budget" placeholder="Enter your budget (₹)">

    <button onclick="checkDeal()">Check Deal</button>

    <div class="result" id="output">
        Enter product & budget to see suggestions
    </div>
</div>

<script>
function checkDeal() {
    let product = document.getElementById("product").value;
    let budget = document.getElementById("budget").value;

    if (product === "" || budget === "") {
        document.getElementById("output").innerHTML =
            "❌ Please enter product name and budget";
        return;
    }

    let priceCategory = "";
    let platform = "";
    let advice = "";

    if (budget < 1000) {
        priceCategory = "Cheap";
        platform = "Local store";
        advice = "Good for basic use. Check quality before buying.";
    } 
    else if (budget < 5000) {
        priceCategory = "Mid-range";
        platform = "Online store";
        advice = "Best value for money. Buy during sales.";
    } 
    else {
        priceCategory = "Expensive";
        platform = "Official brand website";
        advice = "Premium product. Check warranty & reviews.";
    }

    document.getElementById("output").innerHTML =
        "<b>Product:</b> " + product + "<br>" +
        "<b>Price Category:</b> " + priceCategory + "<br>" +
        "<b>Suggested Platform:</b> " + platform + "<br>" +
        "<b>Advice:</b> " + advice;
}

</html>
